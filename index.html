<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Brightloop</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        :root {
            --bg: #f5f6fb;
            --card: #fff;
            --ink: #1c2236;
            --mute: #6b7390;
            --line: #e7e9f2;
            --brand: #4f46e5;
            --side: #161b2e
        }

        * {
            box-sizing: border-box
        }

        body {
            font-family: Inter, system-ui, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--ink)
        }

        #shell {
            display: flex;
            min-height: 100vh
        }

        nav {
            width: 230px;
            background: var(--side);
            color: #c9cee6;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: sticky;
            top: 0;
            height: 100vh
        }

        nav .logo {
            color: #fff;
            font-weight: 700;
            font-size: 19px;
            padding: 4px 12px 18px
        }

        nav .logo span {
            color: #818cf8
        }

        nav a {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px
        }

        nav a:hover {
            background: #ffffff12
        }

        nav a.on {
            background: var(--brand);
            color: #fff
        }

        nav .me {
            margin-top: auto;
            font-size: 12px;
            padding: 12px;
            border-top: 1px solid #ffffff1f
        }

        nav .me button {
            margin-top: 8px;
            width: 100%;
            background: #ffffff14
        }

        #main {
            flex: 1;
            padding: 28px 32px;
            max-width: 1100px
        }

        h1 {
            margin: 0 0 4px;
            font-size: 24px
        }

        .sub {
            color: var(--mute);
            margin-bottom: 22px;
            font-size: 14px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px
        }

        .card h3 {
            margin: 0 0 14px;
            font-size: 15px
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px;
            margin-bottom: 18px
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px 18px
        }

        .stat small {
            color: var(--mute);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .04em
        }

        .stat b {
            display: block;
            font-size: 26px;
            margin-top: 6px
        }

        .stat.warn b {
            color: #d9480f
        }

        input,
        select,
        textarea,
        button {
            font: inherit;
            font-size: 14px;
            padding: 9px 11px;
            border: 1px solid #d3d7e6;
            border-radius: 8px;
            width: 100%;
            background: #fff;
            color: var(--ink)
        }

        label {
            font-size: 12px;
            color: var(--mute);
            display: block;
            margin-bottom: 3px
        }

        button {
            background: var(--brand);
            color: #fff;
            border: 0;
            cursor: pointer;
            width: auto;
            font-weight: 600;
            padding: 9px 16px
        }

        button:hover {
            filter: brightness(1.1)
        }

        button.sm {
            padding: 5px 10px;
            font-size: 12px;
            margin-right: 4px
        }

        button.alt {
            background: #eceefa;
            color: var(--brand)
        }

        button.danger {
            background: #fdeaea;
            color: #c92a2a
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 12px
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--mute);
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--line)
        }

        td {
            padding: 11px 8px;
            border-bottom: 1px solid var(--line);
            font-size: 14px
        }

        tr:last-child td {
            border: 0
        }

        .num {
            text-align: right
        }

        .wrap {
            overflow-x: auto
        }

        .badge {
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600
        }

        .active,
        .paid {
            background: #dcf5e4;
            color: #1f7a3a
        }

        .sent {
            background: #e3ebff;
            color: #2b4acb
        }

        .paused,
        .draft {
            background: #fff1d6;
            color: #a86400
        }

        .overdue,
        .cancelled,
        .void {
            background: #fde3e3;
            color: #c92a2a
        }

        .expired {
            background: #eceef4;
            color: #5b627b
        }

        .pager {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: flex-end;
            margin-top: 12px;
            font-size: 13px;
            color: var(--mute)
        }

        .quote {
            background: #f3f4ff;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            margin: 10px 0
        }

        .quote div {
            display: flex;
            justify-content: space-between;
            padding: 2px 0
        }

        .quote .t {
            font-weight: 700;
            border-top: 1px solid #d9dcf5;
            margin-top: 4px;
            padding-top: 6px
        }

        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 18px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            display: none;
            z-index: 9
        }

        .auth {
            max-width: 400px;
            margin: 9vh auto;
            padding: 0 16px
        }

        .auth .card {
            padding: 28px
        }

        .auth h2 {
            margin-top: 0
        }

        .links {
            font-size: 13px;
            color: var(--mute);
            margin-top: 14px
        }

        .links a {
            color: var(--brand);
            cursor: pointer
        }

        .err {
            color: #c92a2a;
            font-size: 13px;
            margin: 8px 0
        }

        .ok {
            color: #1f7a3a;
            font-size: 13px;
            margin: 8px 0
        }

        @media(max-width: 760px) {
            #shell {
                flex-direction: column
            }

            nav {
                width: 100%;
                height: auto;
                position: static;
                flex-direction: row;
                flex-wrap: wrap
            }

            nav .me {
                margin: 0;
                width: 100%
            }

            #main {
                padding: 18px
            }
        }
    </style>
</head>

<body>
    <div id="toast"></div>
    <div id="root"></div>
    <script>
        let token = sessionStorage.getItem("t")
            , me = null
            , view = ""
            , C = {}
            , P = {
                subs: 1,
                inv: 1
            }
            , F = {
                inv: ""
            };
        const $ = id => document.getElementById(id)
            , v = id => $(id).value
            , money = n => Number(n || 0).toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;"
        }[c]));
        const badge = s => `<span class="badge ${s}">${s}</span>`
            , staff = () => me && me.role !== "customer"
            , admin = () => me && me.role === "admin";
        async function api(path, method = "GET", body) {
            const r = await fetch("/api/" + path, {
                method,
                headers: {
                    "Content-Type": "application/json",
                    ...(token ? {
                        Authorization: "Bearer " + token
                    } : {})
                },
                body: body ? JSON.stringify(body) : undefined
            });
            const d = await r.json().catch(() => ({}));
            if (!r.ok)
                throw new Error(d.error || "Error " + r.status);
            return d
        }
        function toast(t, ok = true) {
            const e = $("toast");
            e.textContent = t;
            e.style.background = ok ? "#1f7a3a" : "#c92a2a";
            e.style.display = "block";
            clearTimeout(toast.h);
            toast.h = setTimeout(() => e.style.display = "none", 3200)
        }
        const guard = fn => async (...a) => {
            try {
                await fn(...a)
            } catch (e) {
                toast(e.message, false)
            }
        }
            ;
        const table = (h, r) => `<div class="wrap"><table><tr>${h.map(x => `<th>${x}</th>`).join("")}</tr>${r.map(c => `<tr>${c.map(x => `<td>${x}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${h.length}" style="color:var(--mute)">Nothing here yet</td></tr>`}</table></div>`;
        const pager = (total, page, fn) => {
            const pages = Math.max(1, Math.ceil(total / 20));
            return `<div class="pager">${total} total &middot; page ${page}/${pages}<button class="sm alt" ${page <= 1 ? "disabled" : ""} onclick="${fn}(${page - 1})">Prev</button><button class="sm alt" ${page >= pages ? "disabled" : ""} onclick="${fn}(${page + 1})">Next</button></div>`
        }
            ;
        const head = (t, s) => `<h1>${t}</h1><div class="sub">${s}</div>`;

        /* ---------- auth ---------- */
        function authView(mode = "login", msg = "") {
            const rt = new URLSearchParams(location.search).get("token");
            if (location.pathname === "/reset" && rt)
                mode = "reset";
            const f = {
                login: `<label>Email</label><input id="e"><label>Password</label><input id="p" type="password"><button onclick="doLogin()">Log in</button>`,
                register: `<label>Name</label><input id="n"><label>Email</label><input id="e"><label>Password</label><input id="p" type="password"><div class="sub" style="margin:6px 0 12px">9+ characters with upper, lower and a special character.</div><button onclick="doRegister()">Create account</button>`,
                forgot: `<label>Registered email</label><input id="e"><br><br><button onclick="doForgot()">Send reset link</button>`,
                reset: `<label>New password</label><input id="p" type="password"><br><br><button onclick="doReset('${esc(rt)}')">Set password</button>`
            }[mode];
            $("root").innerHTML = `<div class="auth"><div class="card"><h2>Brightloop <span style="color:var(--brand)">Billing</span></h2><div id="am">${msg}</div>${f}
  <div class="links">${["login", "register", "forgot"].filter(m => m !== mode).map(m => `<a onclick="authView('${m}')">${m == "forgot" ? "Forgot password" : m[0].toUpperCase() + m.slice(1)}</a>`).join(" &middot; ")}</div></div></div>`
        }
        const amsg = (t, ok) => $("am").innerHTML = `<div class="${ok ? "ok" : "err"}">${t}</div>`;
        async function doLogin() {
            try {
                const d = await api("login", "POST", {
                    email: v("e"),
                    password: v("p")
                });
                token = d.token;
                sessionStorage.setItem("t", token);
                boot()
            } catch (e) {
                amsg(e.message)
            }
        }
        async function doRegister() {
            try {
                await api("register", "POST", {
                    name: v("n"),
                    email: v("e"),
                    password: v("p")
                });
                authView("login", '<div class="ok">Account created. Log in below.</div>')
            } catch (e) {
                amsg(e.message)
            }
        }
        async function doForgot() {
            try {
                const d = await api("forgot", "POST", {
                    email: v("e")
                });
                amsg(d.message + " (until v4 the link prints in the server terminal)", 1)
            } catch (e) {
                amsg(e.message)
            }
        }
        async function doReset(t) {
            try {
                await api("reset", "POST", {
                    token: t,
                    password: v("p")
                });
                history.replaceState(0, "", "/");
                authView("login", '<div class="ok">Password updated.</div>')
            } catch (e) {
                amsg(e.message)
            }
        }
        function logout() {
            sessionStorage.removeItem("t");
            token = null;
            me = null;
            authView()
        }

        /* ---------- shell ---------- */
        const NAV = () => staff() ? [["dashboard", "Dashboard"], ["subs", "Subscriptions"], ["invoices", "Invoices"], ["products", "Products"], ["plans", "Plans"], ["discounts", "Discounts &amp; tax"], ...(admin() ? [["team", "Team"]] : [])] : [["subs", "My subscriptions"], ["invoices", "My invoices"]];
        async function boot() {
            if (!token)
                return authView();
            try {
                me = await api("me")
            } catch {
                return logout()
            }
            $("root").innerHTML = `<div id="shell"><nav><div class="logo">Bright<span>loop</span></div><div id="links"></div><div class="me">${esc(me.email)}<br>${me.role}<button onclick="logout()">Log out</button></div></nav><div id="main"></div></div>`;
            go(NAV()[0][0])
        }
        const go = guard(async function (x) {
            view = x;
            $("links").innerHTML = NAV().map(([k, l]) => `<a class="${k === x ? "on" : ""}" onclick="go('${k}')">${l}</a>`).join("");
            $("main").innerHTML = await V[x]();
            if (x === "subs")
                afterSubs()
        });
        const refresh = () => go(view);

        /* ---------- dashboard ---------- */
        const V = {};
        V.dashboard = async () => {
            const s = await api("stats");
            return head("Dashboard", "Live numbers across all subscriptions") + `<div class="stats"><div class="stat"><small>Active subscriptions</small><b>${s.active}</b></div><div class="stat"><small>Monthly recurring revenue</small><b>${money(s.mrr)}</b></div>
 <div class="stat"><small>Total invoiced</small><b>${money(s.billed)}</b></div><div class="stat"><small>Still owed</small><b>${money(s.outstanding)}</b></div>
 <div class="stat warn"><small>Overdue invoices</small><b>${s.overdue}</b></div></div>
 <div class="card"><h3>Renewals</h3><p class="sub">Creates invoices for every active subscription whose billing date has arrived, and flags overdue ones.</p><button onclick="runBilling()">Run billing now</button></div>`
        }
            ;
        const runBilling = guard(async () => {
            const d = await api("billing/run", "POST");
            toast(`${d.invoices_created} invoice(s) created`);
            refresh()
        }
        );

        /* ---------- subscriptions ---------- */
        V.subs = async () => {
            const [cat, l] = await Promise.all([api("catalog"), api(`subscriptions?page=${P.subs}`)]);
            C.cat = cat;
            const cust = staff() ? await api("customers") : [];
            const form = cat.length ? `<div class="card"><h3>${staff() ? "New subscription" : "Subscribe to a plan"}</h3><div class="grid">
  ${staff() ? `<div><label>Customer</label><select id="sc">${cust.map(c => `<option value="${c.id}">${esc(c.email)}</option>`).join("")}</select></div>` : ""}
  <div><label>Plan</label><select id="sp" onchange="planChanged()">${cat.map(p => `<option value="${p.id}">${esc(p.product_name)} &ndash; ${esc(p.name)} (${money(p.price)}/${p.billing_period})</option>`).join("")}</select></div>
  <div><label>Variant</label><select id="sv" onchange="requote()"></select></div><div><label>Quantity</label><input id="sq" type="number" min="1" value="1" oninput="requote()"></div></div>
  <div id="qb" class="quote"></div><button onclick="subscribe()">Subscribe &amp; invoice</button></div>` : `<div class="card">No plans exist yet.</div>`;
            return head(staff() ? "Subscriptions" : "My subscriptions", "Active, paused and past subscriptions") + form + `<div class="card">${table(["#", ...(staff() ? ["Customer"] : []), "Plan", "Qty", "Status", "Next billing", ""], l.items.map(s => [s.id, ...(staff() ? [esc(s.customer_email)] : []), esc(s.plan_name) + ` <small style="color:var(--mute)">${s.billing_period}</small>`, s.quantity, badge(s.status), s.next_billing_date || "-", ["active"].includes(s.status) ? `<button class="sm alt" onclick="subAct(${s.id},'pause')">Pause</button><button class="sm danger" onclick="subAct(${s.id},'cancel')">Cancel</button>` : s.status === "paused" ? `<button class="sm alt" onclick="subAct(${s.id},'resume')">Resume</button><button class="sm danger" onclick="subAct(${s.id},'cancel')">Cancel</button>` : ""]))}${pager(l.total, P.subs, "setSubs")}</div>`
        }
            ;
        const setSubs = n => {
            P.subs = n;
            refresh()
        }
            ;
        function afterSubs() {
            if ($("sp"))
                planChanged()
        }
        const _go = go;
        function planChanged() {
            const p = C.cat.find(x => x.id == v("sp"));
            $("sv").innerHTML = `<option value="">Standard</option>` + p.variants.map(x => `<option value="${x.id}">${esc(x.attribute)}: ${esc(x.value)} (+${money(x.extra_price)})</option>`).join("");
            $("sq").value = Math.max(1, p.min_quantity);
            requote()
        }
        const requote = guard(async () => {
            try {
                const q = await api("quote", "POST", {
                    plan_id: +v("sp"),
                    variant_id: +v("sv") || null,
                    quantity: +v("sq") || 1
                });
                $("qb").innerHTML = `<div><span>${q.quantity} &times; ${money(q.unit_price)}</span><span>${money(q.subtotal)}</span></div>${q.discount ? `<div><span>Discount: ${esc(q.discount_name)}</span><span>&minus;${money(q.discount)}</span></div>` : ""}<div><span>Tax (${q.tax_rate}%)</span><span>${money(q.tax)}</span></div><div class="t"><span>Per billing period</span><span>${money(q.total)}</span></div>`
            } catch (e) {
                $("qb").innerHTML = `<span class="err">${esc(e.message)}</span>`
            }
        }
        );
        const subscribe = guard(async () => {
            const d = await api("subscriptions", "POST", {
                customer_id: staff() ? +v("sc") : undefined,
                plan_id: +v("sp"),
                variant_id: +v("sv") || null,
                quantity: +v("sq") || 1
            });
            toast("Subscribed. First invoice " + d.first_invoice);
            refresh()
        }
        );
        const subAct = guard(async (id, a) => {
            if (a === "cancel" && !confirm("Cancel this subscription?"))
                return;
            await api(`subscriptions/${id}/${a}`, "POST");
            toast("Updated");
            refresh()
        }
        );

        /* ---------- invoices ---------- */
        V.invoices = async () => {
            const l = await api(`invoices?page=${P.inv}${F.inv ? "&status=" + F.inv : ""}`);
            return head(staff() ? "Invoices" : "My invoices", "Overdue status updates automatically") + `<div class="card"><div style="width:200px;margin-bottom:12px"><select onchange="F.inv=this.value;P.inv=1;refresh()">${["", "sent", "paid", "overdue", "void"].map(s => `<option value="${s}" ${F.inv === s ? "selected" : ""}>${s || "All statuses"}</option>`).join("")}</select></div>
 ${table(["Number", ...(staff() ? ["Customer"] : []), "Issued", "Due", "Subtotal", "Discount", "Tax", "Total", "Status"], l.items.map(i => [i.number, ...(staff() ? [esc(i.customer_email)] : []), i.issue_date, i.due_date, money(i.subtotal), money(i.discount), money(i.tax), `<b>${money(i.total)}</b>`, badge(i.status)]))}${pager(l.total, P.inv, "setInv")}</div>`
        }
            ;
        const setInv = n => {
            P.inv = n;
            refresh()
        }
            ;

        /* ---------- admin: products / plans / discounts / team ---------- */
        const pOpts = (ps, blank) => (blank ? `<option value="">${blank}</option>` : "") + ps.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
        const inp = (id, l, t = "text", x = "") => `<div><label>${l}</label><input id="${id}" type="${t}" ${x}></div>`;
        V.products = async () => {
            const ps = await api("products");
            return head("Products", "What Brightloop sells, with variants") + (admin() ? `<div class="card"><h3>New product</h3><div class="grid">${inp("pn", "Name")}${inp("pt", "Type")}${inp("ps", "Sales price", "number")}${inp("pc", "Cost price", "number")}</div>
 <div class="grid">${inp("pno", "Notes")}</div><label>Variants, one per line: Attribute:Value:ExtraPrice (e.g. Brand:Odoo:560)</label><textarea id="pv" rows="3"></textarea><br><br><button onclick="addProduct()">Add product</button></div>` : "") + `<div class="card">${table(["Name", "Type", "Sales", "Cost", "Variants"], ps.map(p => [`<b>${esc(p.name)}</b>`, esc(p.type), money(p.sales_price), money(p.cost_price), p.variants.map(x => `${esc(x.attribute)}: ${esc(x.value)} (+${money(x.extra_price)})`).join("<br>")]))}</div>`
        }
            ;
        const addProduct = guard(async () => {
            const variants = v("pv").split("\n").filter(l => l.trim()).map(l => {
                const [a, b, c] = l.split(":");
                return {
                    attribute: a.trim(),
                    value: (b || "").trim(),
                    extra_price: +c || 0
                }
            }
            );
            await api("products", "POST", {
                name: v("pn"),
                type: v("pt"),
                sales_price: +v("ps"),
                cost_price: +v("pc") || 0,
                notes: v("pno"),
                variants
            });
            toast("Product added");
            refresh()
        }
        );
        V.plans = async () => {
            const [ps, pl] = await Promise.all([api("products"), api("plans")]);
            return head("Plans", "Price and billing frequency") + (admin() ? `<div class="card"><h3>New plan</h3><div class="grid"><div><label>Product</label><select id="lp">${pOpts(ps)}</select></div>${inp("ln", "Plan name")}${inp("lpr", "Price", "number")}
 <div><label>Billing</label><select id="lb"><option>daily</option><option>weekly</option><option selected>monthly</option><option>yearly</option></select></div>${inp("lq", "Min quantity", "number", 'value="1"')}${inp("le", "Plan ends (optional)", "date")}</div><button onclick="addPlan()">Add plan</button></div>` : "") + `<div class="card">${table(["Plan", "Product", "Price", "Billing", "Min qty"], pl.map(p => [`<b>${esc(p.name)}</b>`, esc((ps.find(x => x.id === p.product_id) || {}).name), money(p.price), p.billing_period, p.min_quantity]))}</div>`
        }
            ;
        const addPlan = guard(async () => {
            await api("plans", "POST", {
                product_id: +v("lp"),
                name: v("ln"),
                price: +v("lpr"),
                billing_period: v("lb"),
                min_quantity: +v("lq") || 1,
                end_date: v("le") || null
            });
            toast("Plan added");
            refresh()
        }
        );
        V.discounts = async () => {
            const [ps, ds, tx] = await Promise.all([api("products"), api("discounts"), api("taxes")]);
            return head("Discounts & tax", "Discounts apply to invoices automatically while valid") + (admin() ? `<div class="card"><h3>New discount</h3><div class="grid">${inp("dn", "Name")}
 <div><label>Type</label><select id="dk"><option value="percent">Percent</option><option value="fixed">Fixed amount</option></select></div>${inp("dv", "Value", "number")}${inp("dma", "Min purchase", "number")}${inp("dmq", "Min quantity", "number")}${inp("ds", "Starts", "date")}${inp("de", "Ends", "date")}${inp("du", "Max uses", "number")}
 <div><label>Applies to</label><select id="dp">${pOpts(ps, "Whole subscription")}</select></div></div><button onclick="addDiscount()">Add discount</button></div>
 <div class="card"><h3>Tax rate</h3><div class="grid">${inp("tn", "Name (e.g. VAT)")}${inp("tr", "Rate %", "number")}</div><button onclick="addTax()">Add tax</button></div>` : "") + `<div class="card"><h3>Discounts</h3>${table(["Name", "Type", "Value", "Min", "Valid", "Used"], ds.map(d => [`<b>${esc(d.name)}</b>`, d.kind, d.value, `${d.min_amount || 0} / ${d.min_quantity || 0} qty`, `${d.start_date || "any"} &rarr; ${d.end_date || "any"}`, `${d.times_used}/${d.max_uses ?? "&infin;"}`]))}</div>
 <div class="card"><h3>Taxes</h3>${table(["Name", "Rate"], tx.map(t => [esc(t.name), t.rate_percent + "%"]))}</div>`
        }
            ;
        const addDiscount = guard(async () => {
            await api("discounts", "POST", {
                name: v("dn"),
                kind: v("dk"),
                value: +v("dv"),
                min_amount: +v("dma") || 0,
                min_quantity: +v("dmq") || 0,
                start_date: v("ds") || null,
                end_date: v("de") || null,
                max_uses: +v("du") || null,
                product_id: +v("dp") || null
            });
            toast("Discount added");
            refresh()
        }
        );
        const addTax = guard(async () => {
            await api("taxes", "POST", {
                name: v("tn"),
                rate_percent: +v("tr")
            });
            toast("Tax added");
            refresh()
        }
        );
        V.team = async () => head("Team", "Only admins can add staff") + `<div class="card"><h3>Add staff member</h3><div class="grid">${inp("sn", "Name")}${inp("se", "Email")}${inp("sp2", "Temporary password", "password")}</div><button onclick="addStaff()">Add staff</button></div>`;
        const addStaff = guard(async () => {
            await api("staff", "POST", {
                name: v("sn"),
                email: v("se"),
                password: v("sp2")
            });
            toast("Staff member added")
        }
        );

        boot();
    </script>
</body>

</html>
